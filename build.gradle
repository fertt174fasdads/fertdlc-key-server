plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'fertdlc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'fertdlc.keys.KeyServer'
}

shadowJar {
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    archiveBaseName = 'fertdlc'
    archiveVersion = '1.0.0'
    archiveClassifier = 'all'
    
    // ЭТА СТРОКА ВКЛЮЧАЕТ ТВОЙ КОД В JAR
    from sourceSets.main.output
}
