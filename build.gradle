plugins {
    id 'application'
}

group = 'fertdlc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'fertdlc.keys.KeyServer'
}

// Создаем "толстый" JAR вручную
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    // Включаем все зависимости из runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

// Делаем так, чтобы при сборке создавался именно fatJar
tasks.named('build') {
    dependsOn 'fatJar'
}
