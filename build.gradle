plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'fertdlc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Тут пусто, так как используются только стандартные библиотеки Java
}

application {
    mainClass = 'fertdlc.keys.KeyServer'
}

// Эта задача нужна, чтобы shadowJar правильно собирался
shadowJar {
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}
