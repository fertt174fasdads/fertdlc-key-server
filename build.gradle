plugins {
    id 'application'
    // Добавляем плагин Shadow для сборки толстого JAR
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'fertdlc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'fertdlc.keys.KeyServer'
}

shadowJar {
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}
