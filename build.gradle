plugins {
    id 'application'
}

group = 'fertdlc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral() // Обязательно добавь это!
}

dependencies {
    // Вставь сюда нужные библиотеки. Например:
    // implementation 'org.json:json:20231013'
    // implementation 'com.sparkjava:spark-core:2.9.4'
}

application {
    mainClass = 'fertdlc.keys.KeyServer'
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}