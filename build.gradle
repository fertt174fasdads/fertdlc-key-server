plugins {
    id 'application'
}

group = 'fertdlc'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'fertdlc.keys.KeyServer'
}

// Создаем "толстый" JAR с явным именем файла
tasks.register('fatJar', Jar) {
    archiveBaseName = 'fertdlc'
    archiveVersion = '1.0.0'
    archiveClassifier = 'all' // Это даст имя fertdlc-1.0.0-all.jar
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}
